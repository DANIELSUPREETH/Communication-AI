databases:
  - name: commai-daniel-db
    plan: free
    databaseName: communicate_ai
    user: communicate_ai

services:
  - type: web
    name: commai-daniel-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://commai-daniel.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: commai-daniel-db
          property: connectionString

  - type: web
    name: commai-daniel
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://commai-daniel-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html