# Render Blueprint: API + static frontend + Postgres.
# Render dashboard → New → Blueprint → select this repo.
databases:
  - name: communicate-ai-db
    plan: free
    databaseName: communicate_ai
    user: communicate_ai

services:
  - type: web
    name: communicate-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: CORS_ORIGINS
        sync: false # e.g. https://communicate-ai.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: communicate-ai-db
          property: connectionString

  - type: web
    name: communicate-ai
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://communicate-ai-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
